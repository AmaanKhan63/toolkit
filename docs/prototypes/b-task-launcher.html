<!DOCTYPE html><html lang="en" class="antialiased"><head>

    <link href="https://api.fontshare.com/v2/css?f[]=space-grotesk@400,500,600,700&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = {

                        'tk-cat-docs': '#E4EEE6',

                        'tk-cat-files': '#F9E2D8',

                        'body': ['system-ui', '-apple-system', 'sans-serif'],
                        'mono': ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    spacing: {
                        '0': '0',
                        '4': '4px',
                        '8': '8px',
                        '12': '12px',
                        '16': '16px',
                        '20': '20px',
                        '24': '24px',
                        '32': '32px',
                    },
                    borderRadius: {
                        'tk-card': '16px',
                        'tk-btn': '12px',

            }

    </script>
    <style>

        }

            -ms-overflow-style: none;

        }
        
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 200ms;
        }
    button { min-height: 48px; min-width: 48px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
main { min-height: 0; }
main > div { flex-shrink: 0; }
footer { position: relative !important; bottom: auto !important; }
</style>
</head>
<body>
    
    <div class="bg-tk-canvas-light text-tk-text-light font-body w-full h-screen overflow-hidden w-full h-screen flex flex-col relative" data-sd-id="1">

            <div class="text-center pb-24" data-sd-id="38">

        </main>

        <footer class="shrink-0 bg-tk-surface-light border-t border-tk-border-light pb-[34px] z-40 fixed bottom-0 w-full" data-sd-id="40">
            <nav class="flex justify-around items-center h-[60px] px-8" data-sd-id="41">

                    <div class="w-16 h-8 flex items-center justify-center mb-4" data-sd-id="46">

                    </div>

                <button class="flex flex-col items-center justify-center w-full h-full text-tk-secondary-light hover:text-tk-text-light transition-colors focus:outline-none" data-sd-id="48">

                <div class="w-full flex justify-center pt-12 pb-4" data-sd-id="53">

                </div>
                <div class="px-20 pb-16 flex items-center justify-between border-b border-tk-border-light" data-sd-id="55">
                    <h2 class="font-display text-[20px] font-medium" data-sd-id="56">Settings</h2>
                    <button id="close-settings" aria-label="Close settings" class="p-8 -mr-8 text-tk-secondary-light" data-sd-id="57">
                        <iconify-icon icon="lucide:x" class="text-xl"></iconify-icon>
                    </button>
                </div>
                <div class="overflow-y-auto px-20 py-16 flex-1" data-sd-id="58">
                    <div class="space-y-24" data-sd-id="59">
                        <div data-sd-id="60">

                                <button class="flex-1 py-8 border-2 border-tk-primary rounded-tk-btn bg-tk-canvas-light text-[14px] font-medium" data-sd-id="63">Light</button>
                                <button class="flex-1 py-8 border border-tk-border-light rounded-tk-btn bg-tk-surface-light text-[14px]" data-sd-id="64">System</button>
                                <button class="flex-1 py-8 border border-tk-border-light rounded-tk-btn bg-tk-surface-light text-[14px]" data-sd-id="65">Dark</button>
                            </div>
                        </div>
                        
                        <div data-sd-id="66">
                            <div class="font-medium mb-8" data-sd-id="67">Output Folder</div>
                            <button class="w-full flex items-center justify-between p-12 border border-tk-border-light rounded-tk-btn bg-tk-canvas-light" data-sd-id="68">

                         <div data-sd-id="71">

                        <button class="flex flex-col items-start p-16 bg-tk-surface-light border border-tk-border-light rounded-tk-card active:bg-tk-canvas-light transition-colors text-left" data-sd-id="93">

    </div>

    <script>
        function openSheet(overlay, sheet) {
            overlay.classList.remove('hidden');
            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0');
                sheet.classList.remove('translate-y-full');
            });
        }

        function closeSheet(overlay, sheet) {
            overlay.classList.add('opacity-0');
            sheet.classList.add('translate-y-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        const setups = [
            { btnId: 'settings-btn', overlayId: 'settings-overlay', closeId: 'close-settings' },
            { btnId: 'convert-btn', overlayId: 'convert-overlay', closeId: 'close-convert' }
        ];

        setups.forEach(({ btnId, overlayId, closeId }) => {
            const btn = document.getElementById(btnId);
            const overlay = document.getElementById(overlayId);
            const closeBtn = document.getElementById(closeId);
            if(btn && overlay && closeBtn) {
                const sheet = overlay.querySelector('.absolute');
                btn.addEventListener('click', () => openSheet(overlay, sheet));
                closeBtn.addEventListener('click', () => closeSheet(overlay, sheet));
                overlay.addEventListener('click', (e) => {
                    if(e.target === overlay) closeSheet(overlay, sheet);
                });
            }
        });
    </script>

</body></html>
