<!DOCTYPE html><html lang="en" class="antialiased"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolkit - File Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=space-grotesk@400,500,600,700&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tk-canvas-light': '#F7F7F5',
                        'tk-surface-light': '#FFFFFF',
                        'tk-text-light': '#18251E',
                        'tk-secondary-light': '#58635C',
                        'tk-border-light': '#D9DFD9',
                        'tk-primary': '#1A3C2B',
                        'tk-on-primary': '#FFFFFF',
                        'tk-primary-container': '#E4EEE6',
                        'tk-cat-docs': '#E4EEE6',
                        'tk-cat-dl': '#F7EDC8',
                        'tk-cat-files': '#F9E2D8',
                    },
                    fontFamily: {
                        'display': ['Space Grotesk', 'sans-serif'],
                        'body': ['system-ui', '-apple-system', 'sans-serif'],
                        'mono': ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    spacing: {
                        '0': '0',
                        '4': '4px',
                        '8': '8px',
                        '12': '12px',
                        '16': '16px',
                        '20': '20px',
                        '24': '24px',
                        '32': '32px',
                    },
                    borderRadius: {
                        'tk-card': '16px',
                        'tk-btn': '12px',
                        'tk-input': '12px',
                        'tk-pill': '9999px',
                    },
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-tap-highlight-color: transparent;
        }
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 200ms;
        }
    button { min-height: 48px; min-width: 48px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
main { min-height: 0; }
main > div { flex-shrink: 0; }
footer { position: relative !important; bottom: auto !important; }
</style>
</head>
<body>
    
    <div class="bg-tk-canvas-light text-tk-text-light font-body w-full h-screen overflow-hidden w-full h-screen flex flex-col relative">
        
        <!-- Top App Bar -->
        <header class="shrink-0 pt-14 px-20 pb-16 flex items-center justify-between bg-tk-canvas-light z-10 sticky top-0">
            <h1 class="font-display font-semibold text-[28px] leading-[34px] tracking-tight">Toolkit</h1>
            <button id="settings-btn" class="w-[48px] h-[48px] flex items-center justify-center rounded-tk-pill hover:bg-tk-border-light/50 transition-colors focus:ring-2 focus:ring-tk-primary outline-none" aria-label="Settings">
                <iconify-icon icon="lucide:settings" class="text-2xl"></iconify-icon>
            </button>
        </header>

        <!-- Main Scrollable Content -->
        <main class="flex-1 overflow-y-auto px-20 pb-4 relative flex flex-col">
            
            <!-- Page Title & Actions -->
            <div class="mb-24 flex items-end justify-between">
                <h2 class="text-[18px] leading-[24px] font-medium text-tk-secondary-light">Your files</h2>
                <button class="flex items-center gap-8 text-[14px] font-medium text-tk-primary hover:text-tk-text-light transition-colors">
                    <iconify-icon icon="lucide:folder-plus" class="text-lg"></iconify-icon>
                    Open folder
                </button>
            </div>

            <!-- Search -->
            <div class="relative mb-16">
                <div class="absolute inset-y-0 left-0 pl-12 flex items-center pointer-events-none">
                    <iconify-icon icon="lucide:search" class="text-tk-secondary-light text-xl"></iconify-icon>
                </div>
                <input aria-label="Search files or tools" type="text" placeholder="Search files by name or type..." class="w-full h-[48px] pl-[44px] pr-12 rounded-tk-input border border-tk-border-light bg-tk-surface-light text-[16px] placeholder-tk-secondary-light focus:outline-none focus:border-tk-primary focus:ring-1 focus:ring-tk-primary transition-all">
            </div>

            <!-- Filter Chips -->
            <div class="flex gap-8 overflow-x-auto pb-8 mb-16 -mx-20 px-20">
                <button class="bg-tk-primary text-tk-on-primary px-16 py-8 rounded-tk-pill text-[14px] font-medium whitespace-nowrap">Recent</button>
                <button class="bg-tk-surface-light border border-tk-border-light text-tk-text-light px-16 py-8 rounded-tk-pill text-[14px] font-medium whitespace-nowrap active:bg-tk-canvas-light transition-colors">PDFs</button>
                <button class="bg-tk-surface-light border border-tk-border-light text-tk-text-light px-16 py-8 rounded-tk-pill text-[14px] font-medium whitespace-nowrap active:bg-tk-canvas-light transition-colors">Documents</button>
                <button class="bg-tk-surface-light border border-tk-border-light text-tk-text-light px-16 py-8 rounded-tk-pill text-[14px] font-medium whitespace-nowrap active:bg-tk-canvas-light transition-colors">Media</button>
            </div>

            <!-- File List -->
            <div class="flex flex-col gap-12 pb-32">
                
                <!-- Selected File Item -->
                <button class="w-full flex items-center p-16 bg-tk-primary-container border-2 border-tk-primary rounded-tk-card text-left transition-colors focus:outline-none">
                    <div class="w-10 h-10 rounded-tk-pill bg-tk-surface-light flex items-center justify-center mr-16 text-tk-primary shrink-0">
                        <iconify-icon icon="lucide:file-text" class="text-lg"></iconify-icon>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-[16px] leading-[24px] truncate text-tk-text-light">Q3_Financial_Report_Final.pdf</div>
                        <div class="flex items-center gap-8 mt-4 text-[13px] text-tk-secondary-light font-mono">
                            <span>2.4 MB</span>
                            <span class="w-4 h-4 rounded-full bg-tk-border-light flex items-center justify-center text-[4px]">•</span>
                            <span>Oct 12</span>
                        </div>
                    </div>
                    <div class="shrink-0 ml-16 text-tk-primary">
                        <iconify-icon icon="lucide:check-circle-2" class="text-xl"></iconify-icon>
                    </div>
                </button>

                <!-- File Item -->
                <button class="w-full flex items-center p-16 bg-tk-surface-light border border-tk-border-light rounded-tk-card text-left active:bg-tk-canvas-light transition-colors focus:outline-none">
                    <div class="w-10 h-10 rounded-tk-pill bg-tk-cat-docs flex items-center justify-center mr-16 text-tk-text-light shrink-0">
                        <iconify-icon icon="lucide:file-text" class="text-lg"></iconify-icon>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-[16px] leading-[24px] truncate text-tk-text-light">Project_Alpha_Specs.pdf</div>
                        <div class="flex items-center gap-8 mt-4 text-[13px] text-tk-secondary-light font-mono">
                            <span>1.8 MB</span>
                            <span class="w-4 h-4 rounded-full bg-tk-border-light flex items-center justify-center text-[4px]">•</span>
                            <span>Oct 10</span>
                        </div>
                    </div>
                </button>

                <!-- File Item -->
                <button class="w-full flex items-center p-16 bg-tk-surface-light border border-tk-border-light rounded-tk-card text-left active:bg-tk-canvas-light transition-colors focus:outline-none">
                    <div class="w-10 h-10 rounded-tk-pill bg-tk-cat-files flex items-center justify-center mr-16 text-tk-text-light shrink-0">
                        <iconify-icon icon="lucide:image" class="text-lg"></iconify-icon>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-[16px] leading-[24px] truncate text-tk-text-light">Scan_Receipt_Hotel.jpg</div>
                        <div class="flex items-center gap-8 mt-4 text-[13px] text-tk-secondary-light font-mono">
                            <span>845 KB</span>
                            <span class="w-4 h-4 rounded-full bg-tk-border-light flex items-center justify-center text-[4px]">•</span>
                            <span>Oct 09</span>
                        </div>
                    </div>
                </button>

                <!-- File Item -->
                <button class="w-full flex items-center p-16 bg-tk-surface-light border border-tk-border-light rounded-tk-card text-left active:bg-tk-canvas-light transition-colors focus:outline-none">
                    <div class="w-10 h-10 rounded-tk-pill bg-tk-cat-dl flex items-center justify-center mr-16 text-tk-text-light shrink-0">
                        <iconify-icon icon="lucide:video" class="text-lg"></iconify-icon>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-[16px] leading-[24px] truncate text-tk-text-light">demo_lecture_recording_2023.mp4</div>
                        <div class="flex items-center gap-8 mt-4 text-[13px] text-tk-secondary-light font-mono">
                            <span class="text-tk-primary">Downloading...</span>
                        </div>
                    </div>
                </button>

            </div>
            
            <!-- Demo Notice -->
            <div class="text-center pb-24 mt-auto">
                 <span class="inline-block px-12 py-4 bg-tk-border-light/40 text-[12px] text-tk-secondary-light rounded-tk-pill">
                     Prototype Demo State
                 </span>
            </div>

        </main>

        <!-- Contextual Action Bar (Floating) -->
        <div class="shrink-0 mx-20 mb-12 bg-tk-primary text-tk-on-primary rounded-tk-card px-16 py-12 shadow-lg flex items-center justify-between z-30">
            <span class="text-[14px] font-medium">1 selected</span>
            <div class="flex gap-8">
                <button class="p-8 rounded-tk-pill hover:bg-tk-surface-light/20 transition-colors flex items-center justify-center" aria-label="Preview"><iconify-icon icon="lucide:eye" class="text-xl"></iconify-icon></button>
                <button class="p-8 rounded-tk-pill hover:bg-tk-surface-light/20 transition-colors flex items-center justify-center" aria-label="Merge"><iconify-icon icon="lucide:layers" class="text-xl"></iconify-icon></button>
                <button class="p-8 rounded-tk-pill hover:bg-tk-surface-light/20 transition-colors flex items-center justify-center" aria-label="Compress"><iconify-icon icon="lucide:minimize-2" class="text-xl"></iconify-icon></button>
                <button class="p-8 rounded-tk-pill hover:bg-tk-surface-light/20 transition-colors flex items-center justify-center" aria-label="Share"><iconify-icon icon="lucide:share" class="text-xl"></iconify-icon></button>
            </div>
        </div>

        <!-- Ongoing Download Strip -->
        <div class="px-20 pb-16 z-20 bg-gradient-to-t from-tk-canvas-light via-tk-canvas-light to-transparent pt-8 shrink-0">
            <div class="flex items-center p-12 bg-tk-surface-light rounded-tk-card border border-tk-border-light shadow-sm">
                <div class="w-10 h-10 rounded-tk-pill bg-tk-primary-container flex items-center justify-center mr-12 text-tk-primary shrink-0">
                    <iconify-icon icon="lucide:arrow-down-circle" class="text-lg animate-pulse"></iconify-icon>
                </div>
                <div class="flex-1 min-w-0 mr-12">
                    <div class="font-medium text-[14px] truncate">demo_lecture_recording_2023.mp4</div>
                    <div class="flex items-center mt-4">
                        <div class="w-full bg-tk-border-light h-4 rounded-full overflow-hidden mr-8">
                            <div class="bg-tk-primary h-full rounded-full" style="width: 65%"></div>
                        </div>
                        <span class="font-mono text-[12px] text-tk-secondary-light shrink-0">65%</span>
                    </div>
                </div>
                <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-tk-border-light/50 transition-colors text-tk-primary" aria-label="Pause download">
                    <iconify-icon icon="lucide:pause" class="text-lg"></iconify-icon>
                </button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <footer class="shrink-0 bg-tk-surface-light border-t border-tk-border-light pb-[34px] z-40 fixed bottom-0 w-full">
            <nav class="flex justify-around items-center h-[60px] px-8">
                <button class="flex flex-col items-center justify-center w-full h-full text-tk-secondary-light hover:text-tk-text-light transition-colors focus:outline-none">
                    <div class="w-16 h-8 flex items-center justify-center mb-4">
                        <iconify-icon icon="lucide:grid" class="text-xl"></iconify-icon>
                    </div>
                    <span class="text-[12px] font-medium">Tools</span>
                </button>
                
                <button class="flex flex-col items-center justify-center w-full h-full text-tk-secondary-light hover:text-tk-text-light transition-colors focus:outline-none">
                    <div class="w-16 h-8 flex items-center justify-center mb-4">
                        <iconify-icon icon="lucide:download" class="text-xl"></iconify-icon>
                    </div>
                    <span class="text-[12px] font-medium">Downloads</span>
                </button>
                
                <button class="flex flex-col items-center justify-center w-full h-full text-tk-primary focus:outline-none">
                    <div class="w-16 h-8 flex items-center justify-center bg-tk-primary-container rounded-tk-pill mb-4">
                        <iconify-icon icon="lucide:folder-open" class="text-xl"></iconify-icon>
                    </div>
                    <span class="text-[12px] font-medium">Files</span>
                </button>
            </nav>
        </footer>

        <!-- Settings Overlay -->
        <div id="settings-overlay" class="fixed inset-0 bg-black/20 z-50 hidden opacity-0 transition-opacity duration-200">
            <div class="absolute bottom-0 w-full bg-tk-surface-light rounded-t-2xl transform translate-y-full transition-transform duration-300 ease-out flex flex-col max-h-[90vh]">
                <div class="w-full flex justify-center pt-12 pb-4">
                    <div class="w-[48px] h-4 bg-tk-border-light rounded-full"></div>
                </div>
                <div class="px-20 pb-16 flex items-center justify-between border-b border-tk-border-light">
                    <h2 class="font-display text-[20px] font-medium">Settings</h2>
                    <button id="close-settings" aria-label="Close settings" class="p-8 -mr-8 text-tk-secondary-light">
                        <iconify-icon icon="lucide:x" class="text-xl"></iconify-icon>
                    </button>
                </div>
                <div class="overflow-y-auto px-20 py-16 flex-1">
                    <div class="space-y-24">
                        <div>
                            <div class="font-medium mb-8">Theme</div>
                            <div class="flex gap-8">
                                <button class="flex-1 py-8 border-2 border-tk-primary rounded-tk-btn bg-tk-canvas-light text-[14px] font-medium">Light</button>
                                <button class="flex-1 py-8 border border-tk-border-light rounded-tk-btn bg-tk-surface-light text-[14px]">System</button>
                                <button class="flex-1 py-8 border border-tk-border-light rounded-tk-btn bg-tk-surface-light text-[14px]">Dark</button>
                            </div>
                        </div>
                        
                        <div>
                            <div class="font-medium mb-8">Output Folder</div>
                            <button class="w-full flex items-center justify-between p-12 border border-tk-border-light rounded-tk-btn bg-tk-canvas-light">
                                <div class="flex items-center gap-12 overflow-hidden">
                                    <iconify-icon icon="lucide:folder" class="text-tk-secondary-light shrink-0"></iconify-icon>
                                    <span class="font-mono text-[13px] truncate">Downloads / Toolkit (sample)</span>
                                </div>
                                <iconify-icon icon="lucide:chevron-right" class="text-tk-secondary-light shrink-0"></iconify-icon>
                            </button>
                        </div>
                        
                         <div>
                            <div class="font-medium mb-8 flex justify-between">
                                <span>History Retention</span>
                                <span class="text-tk-secondary-light text-[14px]">30 days</span>
                            </div>
                            <input type="range" min="1" max="3" value="2" class="w-full accent-tk-primary">
                        </div>
                    </div>
                </div>
                <div class="p-20 border-t border-tk-border-light pb-[calc(20px+34px)]">
                    <button class="w-full py-12 bg-tk-primary text-tk-on-primary rounded-tk-btn font-medium text-[16px]">Done</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const settingsBtn = document.getElementById('settings-btn');
        const settingsOverlay = document.getElementById('settings-overlay');
        const closeSettings = document.getElementById('close-settings');
        const settingsSheet = settingsOverlay.querySelector('.absolute');

        function openSheet(overlay, sheet) {
            overlay.classList.remove('hidden');
            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0');
                sheet.classList.remove('translate-y-full');
            });
        }

        function closeSheet(overlay, sheet) {
            overlay.classList.add('opacity-0');
            sheet.classList.add('translate-y-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        if(settingsBtn && settingsOverlay && closeSettings) {
            settingsBtn.addEventListener('click', () => openSheet(settingsOverlay, settingsSheet));
            closeSettings.addEventListener('click', () => closeSheet(settingsOverlay, settingsSheet));
            settingsOverlay.addEventListener('click', (e) => {
                if(e.target === settingsOverlay) closeSheet(settingsOverlay, settingsSheet);
            });
        }
    </script>

</body></html>
