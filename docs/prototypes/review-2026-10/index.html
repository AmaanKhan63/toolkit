<body><div id="app" class="relative flex flex-col">
<div class="reviewbar"><span>Design prototype<br>Sample data only</span><button onclick="go('review')">Review screens</button><button onclick="go('identity')">Icon concepts</button></div>
<header id="header" class="appheader"></header><main id="main" tabindex="-1"></main><div id="actions"></div><nav id="nav" class="bottomnav" aria-label="Main navigation"></nav>
<div id="toast" class="toast" role="status" hidden></div><dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions" class="dialogbuttons"></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=(name)=>`<iconify-icon icon="ph:${name}" aria-hidden="true"></iconify-icon>`;
const iconbutton=(icon,label,action,disabled=false)=>`<button class="iconbutton" aria-label="${esc(label)}" onclick="${action}" ${disabled?'disabled':''}>${ico(icon)}</button>`;
const categories=[['create','Create PDF','Images, scans, documents','file-plus-duotone'],['convert','Convert','PDF to other formats','arrows-left-right-duotone'],['organize','Organize pages','Merge, split, arrange','stack-duotone'],['protect','Protect','PDF & Excel passwords','lock-key-duotone'],['optimize','Optimize','Size & metadata','arrows-in-duotone'],['workflows','Workflows','Chain your tools','flow-arrow-duotone']];
const tools=[
['D01','create','Images to PDF','Arrange photos into a document','images-duotone'],['P05','create','Scan to PDF','Capture and straighten pages','scan-duotone'],['D06','create','Word to PDF','Convert a document','file-doc-duotone'],['D07','create','Excel to PDF','Use sheets and print areas','file-xls-duotone'],['D08','create','Presentation to PDF','Create a page for each slide','presentation-duotone'],['D13','create','HTML to PDF','Convert local HTML','file-html-duotone'],['P15','create','Text / Markdown to PDF','Turn writing into pages','markdown-logo-duotone'],
['D09','convert','PDF to Word','Reconstruct an editable document','file-doc-duotone'],['D10','convert','PDF to Excel','Extract tables into sheets','file-xls-duotone'],['D11','convert','PDF to presentation','Choose slide output','presentation-duotone'],['D12','convert','PDF to images','Export pages or embedded images','images-duotone'],['P14','convert','PDF to text / Markdown','Extract an existing text layer','text-align-left-duotone'],
['D02','organize','Merge PDF','Join documents in your order','stack-duotone'],['P01','organize','Split / extract pages','Keep just the pages you need','scissors-duotone'],['P02','organize','Organize pages','Reorder, rotate, insert or remove','squares-four-duotone'],['P03','organize','Crop pages','Adjust visible page margins','crop-duotone'],['P04','organize','Watermark / page numbers','Add a label or numbering','stamp-duotone'],['P09','organize','Draw / place signature','Place a handwritten signature','signature-duotone'],['D03','protect','Lock / unlock PDF','Manage the file password','lock-key-duotone'],['D04','protect','Excel protection','File password or editing protection','shield-check-duotone'],['D05','optimize','Compress PDF','Balance file size and quality','arrows-in-duotone'],['P16','optimize','Document metadata','Inspect and remove properties','info-duotone']];
let state={screen:'home',arg:null,trail:[],tab:'Tools',theme:'dark',images:['Cover scan.jpg','Travel notes.jpg'],paper:'A4',orientation:'Auto',margin:'Standard',page:1,zoom:100,tool:'D01',pinned:[],savedTemplate:false,workflow:['Images to PDF','Watermark','Compress PDF','Lock PDF'],queue:[],files:[],filter:'All',query:'',icon:'A',source:'video',readMode:'Rendered',sheet:1,downloadTab:'Active',runToken:0};
const sampleFiles=[['Trip notes.pdf','PDF','2 pages · 248 KB','file-pdf-duotone'],['Readme.md','Markdown','4 KB','markdown-logo-duotone'],['Proposal.docx','Word','3 pages · 86 KB','file-doc-duotone'],['Budget.xlsx','Excel','2 sheets · 32 KB','file-xls-duotone'],['Project update.pptx','Slides','4 slides · 920 KB','presentation-duotone'],['Example.json','Text','2 KB','code-duotone'],['A short journey.epub','EPUB','6 chapters · 320 KB','book-open-duotone'],['Local notes.html','HTML','12 KB · Offline','file-html-duotone']];
let toastTimer;
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function dialog(title,body,buttons=[['Close',()=>{}]]){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog-actions').replaceChildren();buttons.forEach(([label,fn],i)=>{const b=document.createElement('button');b.className=i===buttons.length-1?'primary':'secondary';b.textContent=label;b.onclick=()=>{$('#dialog').close();fn()};$('#dialog-actions').append(b)});$('#dialog').showModal()}
function info(title,text){dialog(title,`<p>${esc(text)}</p>`)}
function go(screen,arg=null,root=false){if(root){state.trail=[]}else state.trail.push([state.screen,state.arg,$('#main').scrollTop]);state.screen=screen;state.arg=arg;if(['home','downloads','files'].includes(screen))state.tab=screen==='downloads'?'Downloads':screen==='files'?'Files':'Tools';render();$('#main').scrollTop=0;$('#main').focus({preventScroll:true})}
function back(){const prev=state.trail.pop();if(prev){[state.screen,state.arg]=prev;render();$('#main').scrollTop=prev[2]}else go('home',null,true)}
function setTheme(t){state.theme=t;document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t;render()}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(state.theme==='system')setTheme('system')});
function head(title,root=false,extra=''){$('#header').className='appheader'+(root?'':' subheader');$('#header').innerHTML=(root?'':iconbutton('arrow-left','Back','back()'))+`<h1>${esc(title)}</h1>`+extra+(root?iconbutton('gear-six','Settings',"go('settings')"):'')}
function action(label,fn,secondary=''){$('#actions').innerHTML=`<div class="actionbar">${secondary}<button class="primary" onclick="${fn}">${label}</button></div>`}
function empty(icon,title,body,cta,fn){return `<div class="empty"><div class="ico">${ico(icon)}</div><h2>${title}</h2><p>${body}</p>${cta?`<button class="primary mt" onclick="${fn}">${cta}</button>`:''}</div>`}
function toolrow(t){return `<button class="toolrow" onclick="openTool('${t[0]}')"><span class="ico soft">${ico(t[4])}</span><span class="grow"><h3>${t[2]}</h3><p>${t[3]}</p></span>${ico('caret-right')}</button>`}
function openTool(id){state.tool=id;go(id==='D01'?'images':'tool',id)}
function thumb(){return '<div class="thumb" aria-hidden="true"><div class="line"></div><div class="line"></div><div class="block"></div><div class="line"></div></div>'}
function option(label,key,values){return `<div class="optionrow"><label for="opt-${key}">${label}</label><select id="opt-${key}" onchange="state.${key}=this.value">${values.map(v=>`<option ${state[key]===v?'selected':''}>${v}</option>`).join('')}</select></div>`}
function field(label,id,placeholder='',value=''){return `<div class="field"><label class="formlabel" for="${id}">${label}</label><input id="${id}" placeholder="${placeholder}" value="${value}"></div>`}
function choices(label,id,values){return `<div class="field"><label class="formlabel" for="${id}">${label}</label><select id="${id}">${values.map(v=>`<option>${v}</option>`).join('')}</select></div>`}
function render(){
 $('#actions').innerHTML='';$('#toast').hidden=true;const root=['home','downloads','files'].includes(state.screen);$('#nav').hidden=!root;
 $('#nav').innerHTML=[['Tools','home','squares-four'],['Downloads','downloads','download-simple'],['Files','files','folder-simple']].map(([name,s,i])=>`<button class="navitem" ${state.tab===name?'aria-current="page"':''} onclick="go('${s}',null,true)"><span class="navicon">${ico(i+(state.tab===name?'-fill':''))}</span>${name}</button>`).join('');
 const m=$('#main');let html='';
 switch(state.screen){
 case 'home':head('Toolkit',true);html=`<div class="search mb">${ico('magnifying-glass')}<input aria-label="Search tools" placeholder="Search tools or formats" oninput="searchTools(this.value)"></div><div id="home-content"><div class="row between mb"><h2>Your tools</h2><button class="textbutton" onclick="go('saved')">Saved ${ico('bookmark-simple')}</button></div><div class="categories">${categories.map(c=>`<button class="category" onclick="go('${c[0]==='workflows'?'workflow':'category'}','${c[0]}')"><span class="ico">${ico(c[3])}</span><h3>${c[1]}</h3><p>${c[2]}</p></button>`).join('')}</div><div class="row mt muted small">${ico('device-mobile')}<span>Document tools work on your device.</span></div></div>`;break;

function searchTools(q){const query=q.trim().toLowerCase();if(!query){render();$('#main input').focus();return}const matches=tools.filter(t=>(t.join(' ')+' '+(t[0]==='D01'?'jpg jpeg png photos':t[0]==='D04'?'xlsx xls spreadsheet':'')).toLowerCase().includes(query));$('#home-content').innerHTML=`<div class="row between mb"><h2>Search results</h2><span class="small muted">${matches.length} tools</span></div>`+(matches.length?categories.map(c=>{const ts=matches.filter(t=>t[1]===c[0]);return ts.length?`<p class="section-label mt">${c[1]}</p><div class="surface">${ts.map(toolrow).join('')}</div>`:''}).join(''):empty('magnifying-glass-duotone','No matching tools','Try a format such as PDF, Word or JPEG.','Clear search',"render();document.querySelector('main input').focus()"))}
function useImages(){state.images=['Cover scan.jpg','Travel notes.jpg'];render()}
function addImage(){if(state.images.length>=20)return toast('This flow supports up to 20 images.');state.images.push('Sample page '+(state.images.length+1)+'.jpg');render()}
function removeImage(i){state.images.splice(i,1);render()}
function moveImage(i,d){[state.images[i],state.images[i+d]]=[state.images[i+d],state.images[i]];render();toast('Page order updated')}
function toolMenu(id){dialog('Tool options','<p>Keep tools you use often in the secondary Saved view.</p>',[['Cancel',()=>{}],[state.pinned.includes(id)?'Remove from Saved':'Save tool',()=>{state.pinned=state.pinned.includes(id)?state.pinned.filter(x=>x!==id):[...state.pinned,id];toast('Saved tools updated')} ]])}
function toolOptions(t){switch(t[0]){case 'D03':return choices('Action','pdf-protection',['Set file-open password','Remove file-open password'])+'<div class="note">A password will be requested securely when running. Unlocking an encrypted file requires its current password. No password recovery is implied.</div>';case 'D04':return choices('Protection type','excel-protection',['Sheet / workbook editing protection','File-open encryption'])+choices('Action','excel-action',['Protect','Remove protection'])+'<p class="small muted">Editing restrictions and an encrypted file-open password are different. XLSX first; legacy XLS requires separate validation.</p>';case 'D05':return choices('Compression','compression',['Balanced','Higher quality','Smaller file'])+'<p class="small muted">Preview the result before replacing any copy. Savings depend on the document.</p>';case 'P16':return '<div class="row between mb"><span>Author</span><span class="muted">Sample author</span></div><div class="row between mb"><span>Title</span><span class="muted">Trip notes</span></div><label class="selection"><input type="checkbox" checked> Remove selected metadata</label>';case 'D02':return '<p class="mb">Combine two sample documents.</p>'+['Trip notes.pdf','Appendix.pdf'].map((n,i)=>`<div class="row between"><span>${i+1}. ${n}</span>${iconbutton('arrows-down-up','Swap document order',"toast('Sample document order swapped.')")}</div>`).join('');case 'P01':return field('Pages to keep','page-range','For example 1-3, 5','1-2')+choices('Output','split-mode',['One PDF','Separate files']);case 'P02':return '<div class="row mb">'+[1,2,3].map(i=>`<div class="grow">${thumb()}<p class="small muted">Page ${i}</p><button class="textbutton" onclick="toast('Sample page rotated 90 degrees.')">Rotate</button></div>`).join('')+'</div><p class="small muted">Native page controls will also reorder, insert, duplicate and remove pages.</p>';case 'P03':return choices('Crop preset','crop',['Trim blank margins','Custom bounds'])+'<p class="small muted">Crop changes visible margins; it is not secure redaction.</p>';case 'P04':return choices('Add','watermark-mode',['Text watermark','Image watermark','Page numbers'])+field('Watermark text','watermark-text','','DRAFT')+choices('Position','watermark-position',['Center','Bottom right']);case 'P09':return '<div class="pagecanvas" style="background:white;color:#141922;text-align:center;font-style:italic;font-size:28px;padding:36px">Sample signature</div><button class="textbutton" onclick="toast(&quot;Sample signature placed on page 1.&quot;)">Place sample signature</button><p class="small muted">A visual handwritten mark, not certificate-based signing.</p>';case 'P05':return '<div class="pagecanvas">'+thumb()+'</div><button class="textbutton" onclick="toast(&quot;Sample page captured and straightened.&quot;)">Use sample scan</button><p class="small muted">Camera capture and corner adjustment will happen on-device.</p>';case 'D12':return choices('Export','image-output',['Pages as PNG','Pages as JPEG','Embedded images'])+choices('Resolution','image-resolution',['150 DPI','300 DPI']);case 'P14':return choices('Output format','text-output',['Plain text','Markdown'])+'<p class="small muted">Requires an existing text layer. Image-only pages cannot be transcribed; OCR is excluded.</p>';case 'D09':case 'D10':case 'D11':return choices('Output','office-output',[t[0]==='D09'?'Word DOCX':t[0]==='D10'?'Excel XLSX':'Image per slide PPTX',t[0]==='D11'?'Editable reconstruction':'Preserve readable layout'])+'<p class="small muted">Reconstructed content may differ from the PDF. Spreadsheet formulas cannot be recovered from a PDF.</p>';default:return choices('Pages','document-pages',['All pages','Selected pages'])+choices('Layout','document-layout',['Preserve document layout','A4 portrait'])+'<p class="small muted">Inspect the rendered result before saving. Unsupported formatting must be reported by the native engine.</p>'}}
function beginPreview(origin){state.origin=origin;state.page=1;state.zoom=100;go('processing');const token=++state.runToken;setTimeout(()=>{if(token===state.runToken&&state.screen==='processing'){state.screen='preview';render()}},700)}
function editResult(){go(state.tool==='D01'?'images':'tool',state.tool)}
function resultName(){return state.tool==='P14'?'Trip notes.txt':state.tool==='D09'?'Trip notes.docx':state.tool==='D10'?'Trip notes.xlsx':state.tool==='D11'?'Trip notes.pptx':state.tool==='D12'?'Exported pages':'Trip notes.pdf'}
function resultDetails(){return state.tool==='D01'?`${Math.max(1,state.images.length)} pages · 248 KB · Sample`:'Sample output · Size shown after generation'}
function paper(page){return `<div class="pagecanvas"><article class="paper" style="width:${state.zoom}%;${state.orientation==='Landscape'&&state.tool==='D01'?'aspect-ratio:297/210;':''}${state.margin==='None'?'padding:12px;':state.margin==='Wide'?'padding:40px;':''}"><span style="font-size:8px;letter-spacing:2px;color:#5f6978">TOOLKIT / SAMPLE DOCUMENT</span><h2>${page===1?'A little room<br>to explore.':'Make time for<br>the details.'}</h2><p>Travel notes · October 2026</p><h3>${page===1?'The weekend plan':'Useful reminders'}</h3><p>${page===1?'A quiet morning, a new neighbourhood, and a few places worth remembering. Keep the plan simple and leave room for discovery.':'Take the longer walk. Find a quiet place for coffee. Write down the small things you would like to remember.'}</p><table><tr><th>Time</th><th>Plan</th></tr><tr><td>09:00</td><td>Walk through the old town</td></tr><tr><td>12:30</td><td>Lunch by the river</td></tr><tr><td>16:00</td><td>Visit the local gallery</td></tr></table><p>Pack a notebook, water, and comfortable shoes.</p><div class="paperfoot">Fictional content for design review · Page ${page}</div></article></div>`}
function pageToolbar(){return `<div class="previewtoolbar"><div class="row gap8">${iconbutton('caret-left','Previous page',"state.page=Math.max(1,state.page-1);render()",state.page===1)}<span class="small">${state.page} / ${(state.tool==='D01'?Math.max(1,state.images.length):2)}</span>${iconbutton('caret-right','Next page',`state.page=Math.min(${(state.tool==='D01'?Math.max(1,state.images.length):2)},state.page+1);render()`,state.page>=(state.tool==='D01'?Math.max(1,state.images.length):2))}</div><button class="textbutton" onclick="state.zoom=state.zoom===100?140:100;render()">${ico('magnifying-glass-plus')} ${state.zoom}%</button></div>`}
function renderResult(){if(state.tool==='P14')return '<div class="panel code">Travel notes\n\nThe weekend plan\n09:00 — Walk through the old town\n12:30 — Lunch by the river\n16:00 — Visit the local gallery</div>';if(state.tool==='D10')return spreadsheet();if(state.tool==='D11')return slide();if(state.tool==='D12')return `<div class="row">${thumb()}${thumb()}</div><p class="small muted mt">Sample result gallery · 2 PNG files</p>`;if(state.tool==='P16')return '<div class="panel"><h3>Metadata changes</h3><div class="optionrow">Author <span class="grow"></span><span class="muted">Sample author → Removed</span></div><div class="optionrow">Title <span class="grow"></span><span class="muted">Trip notes → Removed</span></div></div>';return paper(state.page)+pageToolbar()+(['D03','D04'].includes(state.tool)?'<div class="note">Protection state will be shown alongside the preview. Encrypted outputs require temporary unlock to inspect contents.</div>':'')}
function saveResult(){state.outputName=$('#filename').value.trim()||resultName();state.files.unshift([state.outputName,state.tool==='P14'?'Text':state.tool==='D10'?'Excel':state.tool==='D11'?'Slides':state.tool==='D09'?'Word':'PDF',resultDetails(),'file-duotone']);go('savedresult')}
function queueCard(j){return `<div class="panel"><div class="row"><span class="ico">${ico('download-simple-duotone')}</span><div class="grow"><h3>${esc(j.name)}</h3><p class="small muted">${j.source} · ${j.status}</p></div></div><div class="progress"><span style="width:${j.status==='Completed'?100:j.percent}%"></span></div><div class="row between small muted"><span>${j.status==='Completed'?'24 MB saved':j.status==='Failed'?'Source unavailable':j.status==='Paused'?'Paused':j.percent+'% · Sample progress'}</span><span>${j.status==='Downloading'?'2.4 MB/s':''}</span></div>${j.policy?`<p class="small muted mt">After completion: ${j.policy}</p>`:''}<div class="queueactions">${j.status==='Completed'?`<button onclick="info('Open downloaded file','Supported documents open in the in-app viewer. Other formats use Open with; standalone media and archive viewers are excluded.')">Open</button>`:`<button onclick="toggleJob(${j.id})">${j.status==='Paused'?'Resume':j.status==='Failed'?'Retry':'Pause'}</button>`}<button onclick="cancelJob(${j.id})">${j.status==='Completed'?'Remove from list':'Cancel'}</button></div></div>`}
let jobId=1;
function addJob(name,source,policy){state.queue.push({id:jobId++,name,source,status:'Downloading',percent:36,policy});state.downloadTab='Active';go('downloads',null,true);toast('Added to the sample queue. No download started.')}
function toggleJob(id){const j=state.queue.find(j=>j.id===id);j.status=j.status==='Downloading'?'Paused':'Downloading';render()}
function cancelJob(id){dialog('Remove this sample job?','<p>This review only changes the fictional queue.</p>',[['Keep',()=>{}],['Remove',()=>{state.queue=state.queue.filter(j=>j.id!==id);render()}]])}
function sampleQueue(){state.queue=[{id:jobId++,name:'A walk through the city.mp4',source:'Video link',status:'Downloading',percent:64},{id:jobId++,name:'Reference guide.pdf',source:'Telegram',status:'Paused',percent:28},{id:jobId++,name:'Sample document.pdf',source:'Direct file',status:'Failed',percent:12},{id:jobId++,name:'Readme.txt',source:'Torrent',status:'Completed',percent:100,policy:'Stop seeding'}];state.downloadTab='Active';go('downloads',null,true)}
function filterTelegram(q){document.querySelectorAll('#telegram-list .selection').forEach(n=>n.hidden=!n.dataset.name.includes(q.toLowerCase()))}
function queueTelegram(){const items=[...document.querySelectorAll('input[name=telegram-file]:checked')];if(!items.length)return toast('Select at least one file.');items.forEach(n=>state.queue.push({id:jobId++,name:n.value,source:'Telegram',status:'Downloading',percent:12}));state.downloadTab='Active';go('downloads',null,true)}
function queueTorrent(){const files=[...document.querySelectorAll('input[name=torrent-file]:checked')];if(!files.length)return toast('Select at least one file.');const policy=$('#seeding').value;files.forEach(f=>state.queue.push({id:jobId++,name:f.value,source:'Torrent',status:'Downloading',percent:12,policy}));state.downloadTab='Active';go('downloads',null,true)}
function openSampleFile(){state.files=sampleFiles.map(f=>[...f]);state.filter='All';render();toast('Sample documents opened. No device files accessed.')}
function fileMenu(i){const f=state.files[i]||sampleFiles[0];dialog(f[0],'<p>Removing history does not delete the exported file.</p>',[['Share demo',()=>info('Share','The native app opens Android’s share sheet. No file is shared in this prototype.')],['Remove history',()=>{state.files.splice(i,1);go('files',null,true)}]])}
function spreadsheet(){return `<div class="sheetwrap"><table class="sheet"><tr><th></th><th>A</th><th>B</th><th>C</th></tr><tr><th>1</th><td>Category</td><td>Planned</td><td>Actual</td></tr>${(state.sheet===1?[['Travel','240','218'],['Food','120','105'],['Tickets','60','60'],['Total','420','383']]:[['January','380','360'],['February','420','383'],['March','400','390']]).map((r,i)=>`<tr><th>${i+2}</th>${r.map(x=>`<td tabindex="0" onclick="toast('Cell value: ${x}. Read-only sample.')">${x}</td>`).join('')}</tr>`).join('')}</table></div><div class="tabs mt">${['Budget','Overview'].map((t,i)=>`<button aria-pressed="${state.sheet===i+1}" onclick="state.sheet=${i+1};render()">${t}</button>`).join('')}</div><p class="small muted">Scroll horizontally to inspect columns. Sample values; formula details belong in the cell inspector.</p>`}
function slide(){return `<div class="slide"><span style="font-size:10px;letter-spacing:2px">PROJECT UPDATE / ${state.page}</span><h2>${state.page===1?'Small steps.<br>Better tools.':'A clearer way<br>to get things done.'}</h2><p>Sample slide · October 2026</p></div>${pageToolbar()}`}
function readerContent(f){switch(f[1]){case 'Excel':return spreadsheet();case 'Slides':return slide();case 'Markdown':return `<div class="tabs">${['Rendered','Source'].map(m=>`<button aria-pressed="${state.readMode===m}" onclick="state.readMode='${m}';render()">${m}</button>`).join('')}</div>`+(state.readMode==='Source'?'<pre class="panel code"># Project notes\n\nA useful toolkit should make the next step clear.\n\n- Choose your input\n- Preview the result\n- Save a copy</pre>':'<article class="panel reading"><h2>Project notes</h2><p>A useful toolkit should make the next step clear.</p><ul><li>Choose your input</li><li>Preview the result</li><li>Save a copy</li></ul></article>')+'<p class="small muted mt">Remote images are off by default.</p>';case 'Text':return `<div class="panel code">{\n  "project": "Toolkit",\n  "mode": "sample",\n  "files": 2\n}</div><button class="textbutton mt" onclick="info('Text and tables','Plain text and logs use a streaming text reader. CSV/TSV use a table view. JSON/XML may use structured or source modes. This JSON is a sample.')">Text / table modes</button>`;case 'EPUB':return '<article class="reading panel"><span class="small accent">CHAPTER ONE</span><h2>A short journey</h2><p>The city was still quiet when we set out. There was no hurry, only a small notebook and an afternoon to fill.</p><p>At the end of the street, the river turned toward the old bridge. We followed it, stopping now and then to look back.</p></article><div class="row mt"><button class="secondary" onclick="info(\'Chapters\',\'Chapter 1: A short journey. Chapter 2: The old bridge. Native EPUB reading will remember your position.\')">Chapters</button><button class="secondary" onclick="document.querySelector(\'.reading\').style.fontSize=\'20px\'">Larger text</button></div>';case 'HTML':return '<div class="note mb">Local HTML · Scripts and external resources disabled</div><article class="panel reading"><h2>Local notes</h2><p>A readable page, available offline.</p><ul><li>Prepare documents</li><li>Review the output</li><li>Keep your own copy</li></ul></article>';default:return paper(state.page)+pageToolbar()+`<div class="row"><button class="secondary" onclick="info('Find in document','The native viewer searches an available text layer and shows matches. Scanned images cannot be searched without OCR, which is excluded.')">${ico('magnifying-glass')} Find</button><button class="secondary" onclick="toast('Page '+state.page+' bookmarked in this sample.')">${ico('bookmark-simple')} Bookmark</button></div>`}}
function moveStep(i,d){[state.workflow[i],state.workflow[i+d]]=[state.workflow[i+d],state.workflow[i]];render()}
function removeStep(i){state.workflow.splice(i,1);render()}
function addStep(){const available=['Watermark','Page numbers','Compress PDF','Lock PDF'].filter(n=>!state.workflow.includes(n));if(!available.length)return toast('All compatible sample steps have been added.');dialog('Add compatible step','<p>Only steps accepting the current PDF output are offered.</p>'+choices('Step','new-step',available),[['Cancel',()=>{}],['Add step',()=>{const n=$('#new-step').value;const at=state.workflow.indexOf('Lock PDF');state.workflow.splice(at<0?state.workflow.length:at,0,n);render()}]])}
function settingsRow(icon,title,sub,fn){return `<button class="toolrow" onclick="${fn}">${ico(icon)}<span class="grow"><h3>${title}</h3><p>${sub}</p></span>${ico('caret-right')}</button>`}
function clearHistory(){dialog('Clear file history?','<p>This removes Toolkit’s list. Your exported files remain in their folders.</p>',[['Cancel',()=>{}],['Clear history',()=>{state.files=[];toast('Sample history cleared. No actual files deleted.')} ]])}
function logo(id,cls=''){const shape=id==='A'?'<path fill="currentColor" d="M25 27h58v15H62v40H46V42H25z"/><path fill="currentColor" opacity=".45" d="M62 42h21L62 63z"/>':id==='B'?'<path fill="currentColor" d="M39 28a5 5 0 0 1 5-5h20a5 5 0 0 1 5 5v9h12a5 5 0 0 1 5 5v12H22V42a5 5 0 0 1 5-5h12zm8 9h14v-6H47zM22 61h26v7h12v-7h26v17a5 5 0 0 1-5 5H27a5 5 0 0 1-5-5z"/>':'<path fill="currentColor" d="M27 27h26v26H27zM55 55h26v26H55z"/><path fill="currentColor" opacity=".6" d="M55 27h26v26H55z"/><path fill="currentColor" d="M37 53h8v14h10v8H37zM53 36h10v8H53z"/>';return `<div class="logoicon ${cls}" role="img" aria-label="Concept ${id}${cls.includes('mono')?' monochrome':''}"><svg viewBox="0 0 108 108" aria-hidden="true"><g transform="translate(12.96 12.96) scale(.76)">${shape}</g></svg></div>`}
render();
</script>
</div></body></html>
