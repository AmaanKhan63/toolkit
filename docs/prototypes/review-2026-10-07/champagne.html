function dialog(title,body,buttons=[['Close',()=>{}]]){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog-actions').replaceChildren();buttons.forEach(([label,fn],i)=>{const b=document.createElement('button');b.className=i===buttons.length-1?'primary':'secondary';b.textContent=label;b.onclick=()=>{$('#dialog').close();fn()};$('#dialog-actions').append(b)});$('#dialog').showModal()}

function go(screen,arg=null,root=false){if(root){state.trail=[]}else state.trail.push([state.screen,state.arg,$('#main').scrollTop]);state.screen=screen;state.arg=arg;if(['home','downloads','files'].includes(screen))state.tab=screen==='downloads'?'Downloads':screen==='files'?'Files':'Tools';render();$('#main').scrollTop=0;$('#main').focus({preventScroll:true})}
function back(){const prev=state.trail.pop();if(prev){[state.screen,state.arg]=prev;render();$('#main').scrollTop=prev[2]}else go('home',null,true)}
function setTheme(t){state.theme=t;document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t;render()}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(state.theme==='system')setTheme('system')});
function head(title,root=false,extra=''){$('#header').className='appheader'+(root?'':' subheader');$('#header').innerHTML=(root?'':iconbutton('arrow-left','Back','back()'))+`<h1>${esc(title)}</h1>`+extra+(root?iconbutton('gear-six','Settings',"go('settings')"):'')}
function action(label,fn,secondary=''){$('#actions').innerHTML=`<div class="actionbar">${secondary}<button class="primary" onclick="${fn}">${label}</button></div>`}
function empty(icon,title,body,cta,fn){return `<div class="empty"><div class="ico">${ico(icon)}</div><h2>${title}</h2><p>${body}</p>${cta?`<button class="primary mt" onclick="${fn}">${cta}</button>`:''}</div>`}
function toolrow(t){return `<button class="toolrow" onclick="openTool('${t[0]}')"><span class="ico soft">${ico(t[4])}</span><span class="grow"><h3>${t[2]}</h3><p>${t[3]}</p></span>${ico('caret-right')}</button>`}
function openTool(id){state.tool=id;go(id==='D01'?'images':'tool',id)}
function thumb(){return '<div class="thumb" aria-hidden="true"><div class="line"></div><div class="line"></div><div class="block"></div><div class="line"></div></div>'}
function option(label,key,values){return `<div class="optionrow"><label for="opt-${key}">${label}</label><select id="opt-${key}" onchange="state.${key}=this.value">${values.map(v=>`<option ${state[key]===v?'selected':''}>${v}</option>`).join('')}</select></div>`}
function field(label,id,placeholder='',value=''){return `<div class="field"><label class="formlabel" for="${id}">${label}</label><input id="${id}" placeholder="${placeholder}" value="${value}"></div>`}
function choices(label,id,values){return `<div class="field"><label class="formlabel" for="${id}">${label}</label><select id="${id}">${values.map(v=>`<option>${v}</option>`).join('')}</select></div>`}
function render(){
 $('#actions').innerHTML='';$('#toast').hidden=true;const root=['home','downloads','files'].includes(state.screen);$('#nav').hidden=!root;

 case 'saved':head('Saved');html=state.pinned.length||state.savedTemplate?`<div class="surface">${tools.filter(t=>state.pinned.includes(t[0])).map(toolrow).join('')}${state.savedTemplate?`<button class="toolrow" onclick="go('workflow')"><span class="ico">${ico('flow-arrow-duotone')}</span><span><h3>Prepare a document</h3><p>${state.workflow.length} steps · Sample template</p></span></button>`:''}</div>`:empty('bookmark-simple-duotone','Keep useful tools close','Save a tool from its menu, or create a reusable workflow. Your home stays uncluttered.','Browse tools',"go('home',null,true)");break;
 case 'images':head('Images to PDF',false,iconbutton('dots-three','Tool options',"toolMenu('D01')"));html=state.images.length?`<div class="row between mb"><span class="muted">${state.images.length} images · Arrange pages</span><button class="textbutton" onclick="addImage()">${ico('plus')} Add</button></div><div class="surface">${state.images.map((n,i)=>`<div class="imageitem">${thumb()}<div class="grow"><span class="small accent">Page ${i+1}</span><h3>${esc(n)}</h3><div class="imageactions">${iconbutton('arrow-up',`Move page ${i+1} up`,`moveImage(${i},-1)`,i===0)}${iconbutton('arrow-down',`Move page ${i+1} down`,`moveImage(${i},1)`,i===state.images.length-1)}${iconbutton('x',`Remove page ${i+1}`,`removeImage(${i})`)}</div></div></div>`).join('')}</div><div class="row between mt mb"><h2>Page layout</h2><span class="small muted">Fit without cropping</span></div><div class="surface">${option('Page size','paper',['A4','Letter'])}${option('Orientation','orientation',['Auto','Portrait','Landscape'])}${option('Margins','margin',['None','Standard','Wide'])}</div><p class="small muted mt">PNG & JPEG · Up to 20 images. Originals stay unchanged.</p>`:empty('images-duotone','Start with your images','Choose photos or scans, arrange them, then preview your document.','Use sample images','useImages()');if(state.images.length)action('Preview PDF',"beginPreview('images')",'<p class="small muted">Review the result before saving</p>');break;
 case 'tool':{const t=tools.find(t=>t[0]===state.tool);head(t[2],false,iconbutton('dots-three','Tool options',`toolMenu('${t[0]}')`));html=`<p class="intro">${t[3]}.</p><div class="surface"><div class="toolrow">${thumb()}<span class="grow"><h3>${t[1]==='create'?'Sample document':'Trip notes.pdf'}</h3><p>Sample input · Original stays unchanged</p></span>${iconbutton('arrows-clockwise','Change sample file',"toast('Sample input selected. The Android version will use the system file picker.')")}</div></div><h2 class="mt mb">Options</h2><div class="panel">${toolOptions(t)}</div>`;action('Preview result',"beginPreview('tool')");break}
 case 'processing':head('Preparing preview');html=`<div class="empty"><span class="ico">${ico('file-duotone')}</span><h2>Preparing your result</h2><p>Simulated processing of sample pages.</p><div class="progress" style="width:100%"><span style="width:65%"></span></div></div>`;action('Cancel',"state.runToken++; back()");break;
 case 'preview':head('Preview result');html=`<div class="row between mb"><div><h3>${resultName()}</h3><p class="small muted">${resultDetails()}</p></div><span class="pill">Not saved</span></div>${renderResult()}<p class="small muted mt">Fictional output for design review. In the app, this must render the actual generated file.</p>`;action('Save as',"go('destination')",'<button class="textbutton" style="width:100%;margin-bottom:4px" onclick="editResult()">Back to edit</button>');break;

 case 'savedresult':head('Saved result');html=`<div class="empty"><span class="ico">${ico('check-circle-duotone')}</span><h2>Ready when you need it</h2><p>${esc(state.outputName||resultName())}</p><span class="pill">Sample save completed</span></div><div class="panel row">${thumb()}<div><h3>Downloads / Toolkit</h3><p class="small muted">${resultDetails()}</p></div></div><div class="row mt"><button class="secondary" onclick="go('reader',0)">${ico('eye')} View</button><button class="secondary" onclick="info('Share','Android will open its share sheet for the saved file. Nothing is shared by this prototype.')">${ico('share-network')} Share</button></div>`;action('Done',"go('files',null,true)");break;
 case 'downloads':head('Downloads',true);html=`<div class="row between mb"><h2>Your queue</h2><button class="textbutton" onclick="go('sources')">${ico('plus')} Add</button></div><div class="tabs">${['Active','Completed'].map(t=>`<button aria-pressed="${state.downloadTab===t}" onclick="state.downloadTab='${t}';render()">${t}</button>`).join('')}</div>`;{const q=state.queue.filter(j=>(j.status==='Completed')===(state.downloadTab==='Completed'));html+=q.length?`<div class="stack">${q.map(queueCard).join('')}</div>`:empty('download-simple-duotone',state.downloadTab==='Active'?'A place for your downloads':'Nothing completed yet',state.downloadTab==='Active'?'Add a video link, direct file, Telegram file or torrent.':'Finished downloads will appear here.','Add download',"go('sources')")}break;

 case 'quality':head('Choose format');html=`<div class="panel mb row"><span class="ico">${ico('play-circle-duotone')}</span><div><h3>A walk through the city</h3><p class="small muted">Sample video · 04:32</p></div></div>${choices('Download as','media-type',['Video + audio','Audio only'])}${choices('Quality','quality',['Best available · 1080p','720p','480p'])}${choices('Container','container',['MP4','MKV'])}${choices('Destination','media-dest',['Downloads / Toolkit'])}<button class="textbutton" onclick="info('Multiple items','For a playlist or multiple links, choose which inspected items to add. Each item keeps its own available quality choices.')">Select playlist items</button><p class="small muted mt">Speed depends on the source, connection and device. Highest available quality can require combining streams.</p>`;action('Add to queue',"addJob('A walk through the city.mp4','Video link')");break;
 case 'telegram':head('Connect Telegram');html=`<div class="empty" style="padding-top:16px"><span class="ico">${ico('paper-plane-tilt-duotone')}</span><h2>Your Telegram files</h2><p>Connect your account to browse files in chats and channels you can access.</p></div><div class="surface">${[['1','Register an API app','Get an API ID and hash from Telegram.'],['2','Sign in to your account','Phone number, login code, then two-step password if enabled.'],['3','Choose files','Browse accessible chats and add files to your queue.']].map(([n,t,d])=>`<div class="optionrow"><span class="stepindex" style="margin:0">${n}</span><div><h3>${t}</h3><p class="small muted">${d}</p></div></div>`).join('')}</div><button class="textbutton mt" onclick="go('telegramhelp')">How to get an API ID and hash ${ico('arrow-up-right')}</button><p class="small muted mt">No real credentials are collected in this review.</p>`;action('Use demo connection',"go('telegramfiles')");break;

 case 'torrent':head('Torrent / magnet');html=`${field('Magnet link','magnet','Paste a magnet link','magnet:?xt=urn:btih:sample')}<div class="panel mb"><h3>Sample open media collection</h3><p class="small muted">Metadata loaded · 3 files</p></div><div class="surface">${[['Guide.pdf','2 MB'],['Sample clip.mp4','120 MB'],['Readme.txt','2 KB']].map(([n,s],i)=>`<label class="selection"><input name="torrent-file" type="checkbox" value="${n}" ${i===0?'checked':''}><span class="grow">${n}</span><span class="small muted">${s}</span></label>`).join('')}</div><div class="mt">${choices('Destination','torrent-destination',['Downloads / Toolkit'])}${choices('After download finishes','seeding',['Stop seeding','Seed until I stop it'])}</div><p class="small muted">Downloading and seeding are separate states. Your selected policy stays visible in the queue.</p>`;action('Download selected','queueTorrent()');break;

 case 'workflow':head('Prepare a document');html=`${field('Workflow name','workflow-name','','Prepare a document')}<div class="row between mb"><h2>Steps</h2><span class="small muted">PDF output</span></div>${state.workflow.map((n,i)=>`<div class="step"><span class="stepindex">${i+1}</span><div class="panel"><h3>${n}</h3><select aria-label="${n} options">${(n==='Images to PDF'?['A4 · Fit to page','Letter · Fit to page']:n==='Watermark'?['DRAFT · Center','COPY · Bottom']:n==='Compress PDF'?['Balanced quality','Smaller file']:n==='Page numbers'?['Bottom right','Bottom center']:['Ask for password when running']).map(x=>`<option>${x}</option>`).join('')}</select><div class="stepcontrols">${iconbutton('arrow-up',`Move ${n} up`,`moveStep(${i},-1)`,i<2||n==='Lock PDF')}${iconbutton('arrow-down',`Move ${n} down`,`moveStep(${i},1)`,i===0||i===state.workflow.length-1||state.workflow[i+1]==='Lock PDF')}${iconbutton('trash',`Remove ${n}`,`removeStep(${i})`,i===0)}</div></div></div>`).join('')}<button class="secondary" onclick="addStep()">${ico('plus')} Add compatible step</button><p class="small muted mt">Steps run in order. Password protection stays last; passwords are never saved in the template.</p><button class="textbutton" style="width:100%" onclick="state.savedTemplate=true;toast('Sample template saved in Saved for this review session.')">Save template</button>`;action('Preview sample run',"go('workflowrun')");break;

unds'])+'<p class="small muted">Crop changes visible margins; it is not secure redaction.</p>';case 'P04':return choices('Add','watermark-mode',['Text watermark','Image watermark','Page numbers'])+field('Watermark text','watermark-text','','DRAFT')+choices('Position','watermark-position',['Center','Bottom right']);case 'P09':return '<div class="pagecanvas" style="background:white;color:#141922;text-align:center;font-style:italic;font-size:28px;padding:36px">Sample signature</div><button class="textbutton" onclick="toast(&quot;Sample signature placed on page 1.&quot;)">Place sample signature</button><p class="small muted">A visual handwritten mark, not certificate-based signing.</p>';case 'P05':return '<div class="pagecanvas">'+thumb()+'</div><button class="textbutton" onclick="toast(&quot;Sample page captured and straightened.&quot;)">Use sample scan</button><p class="small muted">Camera capture and corner adjustment will happen on-device.</p>';case 'D12':return choices('Export','image-output',['Pages as PNG','Pages as JPEG','Embedded images'])+choices('Resolution','image-resolution',['150 DPI','300 DPI']);case 'P14':return choices('Output format','text-output',['Plain text','Markdown'])+'<p class="small muted">Requires an existing text layer. Image-only pages cannot be transcribed; OCR is excluded.</p>';case 'D09':case 'D10':case 'D11':return choices('Output','office-output',[t[0]==='D09'?'Word DOCX':t[0]==='D10'?'Excel XLSX':'Image per slide PPTX',t[0]==='D11'?'Editable reconstruction':'Preserve readable layout'])+'<p class="small muted">Reconstructed content may differ from the PDF. Spreadsheet formulas cannot be recovered from a PDF.</p>';default:return choices('Pages','document-pages',['All pages','Selected pages'])+choices('Layout','document-layout',['Preserve document layout','A4 portrait'])+'<p class="small muted">Inspect the rendered result before saving. Unsupported formatting must be reported by the native engine.</p>'}}

};
function renderImages(){head('Images to PDF',false,iconbutton('dots-three','Tool options',"toolMenu('D01')"));const n=state.images.length;$('#main').innerHTML=n?`<div class="panel"><div class="row between"><div><h2>${n} images</h2><p class="small muted">One image per page</p></div><button class="textbutton" onclick="go('organizer')">Manage ${ico('arrow-up-right')}</button></div><div class="mini-pages">${state.images.slice(0,n>6?5:6).map((name,i)=>`<button class="mini-page" aria-label="Manage image ${i+1}" onclick="go('organizer')">${thumb()}<p>${i+1}</p></button>`).join('')}${n>6?`<button class="sample-count" onclick="go('organizer')" aria-label="Manage all ${n} images">+${n-5}</button>`:''}</div><button class="secondary" onclick="addImage()">${ico('plus')} Add images</button></div><div class="row between mt mb"><h2>Page layout</h2><span class="small muted">For all pages</span></div><div class="surface">${option('Page size','paper',['A4','Letter'])}${option('Orientation','orientation',['Auto','Portrait','Landscape'])}<button class="optionrow between" style="width:100%;text-align:left" onclick="marginEditor()"><span>Margins</span><span class="accent">${state.marginLinked?state.marginPx[0]+' px':'Custom sides'} ${ico('caret-right')}</span></button></div><p class="small muted mt">PNG & JPEG · Up to 20 images. Originals stay unchanged.</p>`:empty('images-duotone','Choose your images','Arrange pages separately, then return here to set the layout.','Use sample images','useImages()');if(n)action('Preview PDF',"beginPreview('images')");}
function renderOrganizer(){head('Manage images');$('#main').innerHTML=`<div class="manage-tools row between"><span class="muted">${state.images.length} of 20 images</span><button class="textbutton" onclick="addImage()">${ico('plus')} Add images</button></div><div class="manage-pages">${state.images.map((n,i)=>`<div class="manage-page"><span class="pill">Page ${i+1}</span>${thumb()}<h3 title="${esc(n)}">${esc(n)}</h3><div class="row between"><button class="textbutton" onclick="moveImageTo(${i})">Move to…</button>${iconbutton('trash',`Remove image ${i+1}`,`removeImage(${i})`)}</div></div>`).join('')}</div>`;action('Done · back to layout',"go('images')");}
function moveImageTo(i){dialog('Move page '+(i+1),`<p>Choose a position from 1 to ${state.images.length}.</p><label class="formlabel" for="image-position">New position</label><input type="number" id="image-position" min="1" max="${state.images.length}" value="${i+1}"><div class="error-message" id="move-error" role="alert"></div>`,[['Cancel',()=>{}]]);const b=document.createElement('button');b.className='primary';b.textContent='Move page';b.onclick=()=>{const v=Number($('#image-position').value);if(!Number.isInteger(v)||v<1||v>state.images.length){$('#move-error').textContent='Enter a valid page position.';return}state.images.splice(v-1,0,state.images.splice(i,1)[0]);$('#dialog').close();render();toast('Page moved to position '+v)};$('#dialog-actions').append(b)}
function marginEditor(){dialog('Page margins',`<p>Enter exact margins. px uses a fixed 96 px per inch, independent of screen density.</p><label class="selection"><input id="margin-linked" type="checkbox" ${state.marginLinked?'checked':''} onchange="refreshMarginFields(this.checked)">Use the same margin on every side</label><div id="margin-fields"></div><div class="error-message" id="margin-error" role="alert"></div>`,[['Cancel',()=>{}]]);refreshMarginFields(state.marginLinked);const b=document.createElement('button');b.className='primary';b.textContent='Apply margins';b.onclick=()=>{const linked=$('#margin-linked').checked;const v=[...document.querySelectorAll('#margin-fields input')].map(x=>Number(x.value));if(v.some(x=>!Number.isFinite(x)||x<0||x>160)||[...document.querySelectorAll('#margin-fields input')].some(x=>x.value==='')){$('#margin-error').textContent='Enter a number from 0 to 160 px for each margin.';return}state.marginLinked=linked;state.marginPx=linked?Array(4).fill(v[0]):v;$('#dialog').close();render()};$('#dialog-actions').append(b)}
function refreshMarginFields(linked){const old=[...document.querySelectorAll('#margin-fields input')].map(n=>n.value);const vals=old.length?old:state.marginPx;$('#margin-fields').innerHTML=`<div class="margin-grid">${(linked?['All sides']:['Top','Right','Bottom','Left']).map((name,i)=>`<div><label class="formlabel" for="margin-${i}">${name} (px)</label><input id="margin-${i}" type="number" min="0" max="160" step="1" value="${vals[i]??vals[0]}"></div>`).join('')}</div><p class="small muted mt">0–160 px per side. Preview shows the resulting page inset.</p>`;}
function toolState(){return state.rangeByTool[state.tool]||(state.rangeByTool[state.tool]={mode:'All pages',range:'1-6',pages:[1,2,3,4,5,6]})}
function sourceName(){return ({D04:'Budget.xlsx',D06:'Proposal.docx',D07:'Budget.xlsx',D08:'Project update.pptx',D13:'Local notes.html',P15:'Readme.md'})[state.tool]||'Trip notes.pdf'}
function correctTool(){const row=$('#main .toolrow');if(row){row.querySelector('h3').textContent=sourceName();row.querySelector('p').textContent=(state.tool==='D04'?'2 sheets':'6 sample pages')+' · Original stays unchanged'};if(['D03','D04'].includes(state.tool))action('Preview protected copy',"beginPreview('tool')");}
toolOptions=function(t){if(t[0]==='D03')return choices('Action','pdf-protection',['Set file-open password','Remove file-open password'])+'<div id="password-fields"></div>';if(t[0]==='D04')return choices('Protection type','excel-protection',['File-open encryption','Sheet / workbook editing protection'])+choices('Action','excel-action',['Protect','Remove protection'])+'<div id="password-fields"></div>';let html=baseToolOptions(t);if(t[0]==='D12')html+=choices('Pages','document-pages',['All pages','Selected pages']);if(['D09','D10','D11','P14'].includes(t[0]))html+=choices('Pages','document-pages',['All pages','Selected pages']);if(html.includes('id="document-pages"'))html+='<div id="selected-pages"></div>';return html;}
function parsePages(text,total=6){if(!text.trim())throw Error('Select at least one page.');const output=new Set();for(const part of text.split(',')){const m=part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw Error('Use page numbers or ranges, such as 1-3, 5.');const a=+m[1],b=+(m[2]||m[1]);if(a<1||b>total||b<a)throw Error('Choose page numbers from 1 to '+total+'.');for(let i=a;i<=b;i++)output.add(i)}return [...output].sort((a,b)=>a-b)}
function renderPageSelection(){const s=toolState();s.mode=$('#document-pages').value;let host=$('#selected-pages');if(!host){host=document.createElement('div');host.id='selected-pages';$('#document-pages').parentElement.after(host)}if(s.mode==='All pages'){host.innerHTML='';return}host.innerHTML=`<div class="note mb">Choose pages from the rendered sample document. Word pages are determined after its layout is rendered.</div><label class="formlabel" for="page-range-exact">Page numbers</label><input id="page-range-exact" value="${esc(s.range)}" placeholder="1-3, 5" oninput="updateRange(this.value)"><div class="error-message" id="range-error" role="alert"></div><div class="pagechoices">${Array.from({length:6},(_,i)=>`<label class="pagechoice"><input type="checkbox" aria-label="Page ${i+1}" ${s.pages.includes(i+1)?'checked':''} onchange="togglePage(${i+1},this.checked)"><span>Page ${i+1}</span></label>`).join('')}</div><p class="small muted mt" id="range-summary">${s.pages.length} of 6 pages selected</p>`;}
function updateRange(text){const s=toolState();s.range=text;try{s.pages=parsePages(text);$('#range-error').textContent='';document.querySelectorAll('#selected-pages input[type=checkbox]').forEach((n,i)=>n.checked=s.pages.includes(i+1));$('#range-summary').textContent=s.pages.length+' of 6 pages selected'}catch(e){$('#range-error').textContent=e.message}}
function togglePage(page,on){const s=toolState();s.pages=on?[...new Set([...s.pages,page])].sort((a,b)=>a-b):s.pages.filter(p=>p!==page);s.range=s.pages.join(', ');renderPageSelection()}
function passwordField(label,id){return `<div class="field"><label class="formlabel" for="${id}">${label}</label><div class="passwordwrap"><input id="${id}" data-password type="password" autocomplete="off" placeholder="Use a sample password"><button class="iconbutton" aria-label="Show ${label.toLowerCase()}" onclick="togglePassword('${id}',this)">${ico('eye')}</button></div></div>`}
function togglePassword(id,btn){const n=$('#'+id),show=n.type==='password';n.type=show?'text':'password';btn.setAttribute('aria-label',(show?'Hide ':'Show ')+document.querySelector('label[for="'+id+'"]').textContent.toLowerCase());btn.innerHTML=ico(show?'eye-slash':'eye')}
function protectionAction(){return state.tool==='D03'?$('#pdf-protection')?.value:$('#excel-action')?.value}
function renderPasswordFields(){const h=$('#password-fields');if(!h)return;const unlock=protectionAction()?.startsWith('Remove');h.innerHTML=`<p class="doc-callout">Prototype only: use made-up passwords. ${unlock?'The sample current password is <strong>demo</strong>.':''}</p>${unlock?passwordField('Current password','current-password'):passwordField('New password','new-password')+passwordField('Confirm password','confirm-password')}<div class="error-message" id="password-error" role="alert"></div>${state.tool==='D04'?'<p class="small muted">File-open encryption protects access to contents. Sheet/workbook protection controls editing.</p>':''}`;action(unlock?'Preview unlocked copy':'Preview protected copy',"beginPreview('tool')");}
function validatePasswords(){const unlock=protectionAction()?.startsWith('Remove');const error=$('#password-error');if(unlock){if($('#current-password').value!=='demo'){error.textContent='Incorrect sample password. Enter demo to try the successful flow.';$('#current-password').focus();return false}}else{const a=$('#new-password').value,b=$('#confirm-password').value;if(!a||a!==b){error.textContent=!a?'Enter a sample password.':'Passwords do not match.';(!a?$('#new-password'):$('#confirm-password')).focus();return false}}state.protectionSummary=unlock?'Password removed':(state.tool==='D04'&&$('#excel-protection').value.includes('editing')?'Editing protection enabled':'File-open password set');clearPasswordInputs();return true}
beginPreview=function(origin){if(['D03','D04'].includes(state.tool)&&!validatePasswords())return;if($('#document-pages')?.value==='Selected pages'){try{state.resultPages=parsePages($('#page-range-exact').value)}catch(e){$('#range-error').textContent=e.message;$('#page-range-exact').focus();return}}else state.resultPages=state.tool==='D01'?state.images.map((_,i)=>i+1):[1,2,3,4,5,6];preserveFields();state.origin=origin;state.page=1;state.zoom=100;go('processing');const token=++state.runToken;setTimeout(()=>{if(token===state.runToken&&state.screen==='processing'){state.screen='preview';render()}},450)};
paper=function(p){const source=state.screen==='preview'?(state.resultPages[p-1]||p):p;let html=basePaper(source);if(state.tool==='D01'&&state.screen==='preview'){const pageWidth=state.orientation==='Landscape'?(state.paper==='Letter'?1056:1122.5):(state.paper==='Letter'?816:793.7);const inset=state.marginPx.map(v=>(v/pageWidth*100).toFixed(3)+'%').join(' ');html=html.replace('class="paper" style="','class="paper" style="box-sizing:border-box;').replace('padding:12px;','').replace('padding:40px;','');html=html.replace('<article class="paper"','<article data-margin-px="'+state.marginPx.join(',')+'" class="paper"');html=html.replace('transform-origin:top left;','');html=html.replace(/(<article[^>]*style=")([^"]*)"/,(_,a,b)=>a+b+';padding:'+inset+';"')};return html;};
pageToolbar=function(){const count=state.screen==='preview'?Math.max(1,state.resultPages.length):6;return `<div class="previewtoolbar"><div class="row gap8">${iconbutton('caret-left','Previous page',"state.page--;render()",state.page<=1)}<span class="small">${state.page} / ${count}</span>${iconbutton('caret-right','Next page',"state.page++;render()",state.page>=count)}</div><button class="textbutton" onclick="state.zoom=state.zoom===100?140:100;render()">${ico('magnifying-glass-plus')} ${state.zoom}%</button></div>`};
resultDetails=function(){if(['D03','D04'].includes(state.tool))return (state.protectionSummary||'Protection updated')+' · Sample';return state.resultPages.length+' '+(state.tool==='D12'?'images':'pages')+' · Source '+state.resultPages.join(', ')+' · Sample'};
const oldResultName=resultName;
resultName=function(){return state.tool==='D04'?'Budget.xlsx':oldResultName()};
renderResult=function(){if(state.tool==='D12'){const kind=(state.toolValues['D12:image-output']||'PNG').includes('JPEG')?'jpg':'png';return `<div class="gallery-meta"><h3>Page ${state.resultPages[state.page-1]||state.page}.${kind}</h3><span class="pill">${state.page} of ${state.resultPages.length}</span></div>${pageToolbar()}${paper(state.page)}`};if(state.tool==='D04')return `<div class="note mb">${esc(state.protectionSummary||'Protection updated')}. Contents shown from the temporary unlocked preview.</div>${spreadsheet()}`;return baseResult()};
// Type-aware workflow examples, with no fixed first operation.
const flowOps={
 'excel-unlock':{name:'Unlock Excel',input:['xlsx-locked'],output:'xlsx',options:['File-open password','Sheet / workbook protection'],password:'current'},
 'excel-pdf':{name:'Excel to PDF',input:['xlsx'],output:'pdf',options:['All sheets · Use print areas','Selected sheet · Budget']},
 'images-pdf':{name:'Images to PDF',input:['images'],output:'pdf',options:['A4 · Fit','Letter · Fit']},
 'word-pdf':{name:'Word to PDF',input:['docx'],output:'pdf',options:['All rendered pages','Selected pages at run time']},
 'pdf-unlock':{name:'Unlock PDF',input:['pdf-locked'],output:'pdf',options:['File-open password'],password:'current'},
 'merge':{name:'Merge PDF',input:['pdf'],output:'pdf',options:['Keep input order','Ask for document order']},
 'watermark':{name:'Watermark',input:['pdf'],output:'pdf',options:['DRAFT · Center','COPY · Bottom']},
 'compress':{name:'Compress PDF',input:['pdf'],output:'pdf',options:['Balanced','Higher quality']},
 'pdf-lock':{name:'Lock PDF',input:['pdf'],output:'pdf-locked',options:['Ask for a new password at run time'],password:'new'},
 'pdf-images':{name:'PDF to images',input:['pdf'],output:'images',options:['PNG · All pages','JPEG · All pages']}
};
const typeNames={'xlsx-locked':'Encrypted Excel','xlsx':'Excel workbook','images':'Images','docx':'Word document','pdf':'PDF','pdf-locked':'Encrypted PDF'};
function flowValidation(steps=state.workflowSteps,input=state.workflowInput){let type=input;for(let i=0;i<steps.length;i++){const op=flowOps[steps[i]];if(!op.input.includes(type))return {ok:false,message:`Step ${i+1}: ${op.name} needs ${op.input.map(t=>typeNames[t]).join(' or ')}, but receives ${typeNames[type]}.`};type=op.output}return {ok:true,type}}
function renderWorkflow(){head('Build a workflow');const v=flowValidation();$('#main').innerHTML=`<label class="formlabel" for="flow-name">Workflow name</label><input id="flow-name" value="${esc(state.workflowName)}" oninput="state.workflowName=this.value"><div class="mt input-type"><label class="formlabel" for="flow-input">Start with</label><select id="flow-input" onchange="changeFlowInput(this.value)">${Object.entries(typeNames).map(([id,n])=>`<option value="${id}" ${id===state.workflowInput?'selected':''}>${n}</option>`).join('')}</select></div>${state.workflowSteps.map((id,i)=>{const op=flowOps[id];return `<div class="step"><span class="stepindex">${i+1}</span><div class="panel"><h3>${op.name}</h3><p class="flowtypes">${op.input.map(t=>typeNames[t]).join('/')} → ${typeNames[op.output]}</p><select aria-label="${op.name} options" id="flow-option-${i}" onchange="state.workflowOptions[${i}]=this.value">${op.options.map(o=>`<option ${o===state.workflowOptions[i]?'selected':''}>${o}</option>`).join('')}</select><div class="stepcontrols">${iconbutton('arrow-up','Move '+op.name+' up',`moveFlow(${i},-1)`,i===0)}${iconbutton('arrow-down','Move '+op.name+' down',`moveFlow(${i},1)`,i===state.workflowSteps.length-1)}${iconbutton('trash','Remove '+op.name,`removeFlow(${i})`)}</div></div></div>`}).join('')}<div class="error-message mb" role="alert">${esc(state.workflowError||(!v.ok?v.message:''))}</div><button class="secondary" onclick="addFlowStep()">${ico('plus')} Add compatible step</button><p class="small muted mt">Choose any supported input. Each step receives the previous result. Passwords are requested when running, never saved in the template.</p><button class="textbutton" style="width:100%" onclick="saveFlow()">Save template</button>`;action('Review and run',"reviewFlowRun()");}
function changeFlowInput(input){state.workflowInput=input;state.workflowError='';render()}
function moveFlow(i,d){const next=[...state.workflowSteps];[next[i],next[i+d]]=[next[i+d],next[i]];const v=flowValidation(next);if(!v.ok){state.workflowError=v.message;render();return}state.workflowSteps=next;state.workflowError='';render()}
function removeFlow(i){state.workflowSteps.splice(i,1);state.workflowOptions={};state.workflowError='';render()}
function addFlowStep(){const v=flowValidation();if(!v.ok){state.workflowError=v.message;render();return}const options=Object.entries(flowOps).filter(([id,o])=>o.input.includes(v.type));dialog('Add a step',`<p>Receives ${typeNames[v.type]}.</p><div id="available-steps" class="stack"></div>`,[['Cancel',()=>{}]]);for(const [id,op] of options){const b=document.createElement('button');b.className='secondary';b.textContent=op.name+' → '+typeNames[op.output];b.onclick=()=>{state.workflowSteps.push(id);state.workflowError='';$('#dialog').close();render()};$('#available-steps').append(b)}}
function saveFlow(){const v=flowValidation();if(!v.ok||!state.workflowSteps.length){state.workflowError=v.message||'Add at least one step.';render();return}state.savedTemplate=true;state.workflow=state.workflowSteps.map(id=>flowOps[id].name);toast('Template saved for this sample session. No passwords stored.')}
function reviewFlowRun(){const v=flowValidation();if(!v.ok||!state.workflowSteps.length){state.workflowError=v.message||'Add at least one step.';render();return}const needs=state.workflowSteps.map(id=>flowOps[id].password).filter(Boolean);if(!needs.length){go('workflowrun');return}dialog('Passwords for this run',`<p>Sample only. Use demo for an existing password. These fields are discarded after running.</p>${needs.includes('current')?passwordField('Current Excel / PDF password','flow-current'):''}${needs.includes('new')?passwordField('New PDF password','flow-new')+passwordField('Confirm new PDF password','flow-confirm'):''}<div class="error-message" id="flow-password-error" role="alert"></div>`,[['Cancel',()=>clearPasswordInputs()]]);const b=document.createElement('button');b.className='primary';b.textContent='Run sample workflow';b.onclick=()=>{if(needs.includes('current')&&$('#flow-current').value!=='demo'){$('#flow-password-error').textContent='The sample current password is demo.';return}if(needs.includes('new')&&(!$('#flow-new').value||$('#flow-new').value!==$('#flow-confirm').value)){$('#flow-password-error').textContent='Enter matching new sample passwords.';return}clearPasswordInputs();$('#dialog').close();go('workflowrun')};$('#dialog-actions').append(b)}
function renderWorkflowRun(){head('Workflow result');$('#main').innerHTML=`<div class="note mb">Simulated run · ${typeNames[state.workflowInput]} → ${typeNames[flowValidation().type]}</div><div class="surface">${state.workflowSteps.map((id,i)=>`<div class="optionrow">${ico('check-circle-duotone')}<span>${i+1}. ${flowOps[id].name}</span></div>`).join('')}</div><h2 class="mt mb">Final document</h2>${paper(1)}`;action('Preview output',"state.tool='D03';state.protectionSummary='File-open password set';state.resultPages=[1,2];go('preview')")}
function renderThemes(){head('Themes');$('#main').innerHTML=`<p class="intro">Three directions for Toolkit. Switch a theme, then explore the same screens in light or dark.</p><div class="segmented mb">${['light','dark','system'].map(t=>`<button aria-pressed="${state.theme===t}" onclick="setTheme('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${Object.entries(palettes).map(([id,p],i)=>`<div class="theme-card" aria-pressed="${state.themeFamily===id}"><span class="theme-number">0${i+1}</span><h2>${p.name}</h2><p class="small muted">${p.description}</p><div class="theme-swatch">${['bg','surface','muted','accent'].map(k=>`<span style="background:${p.dark[k]}"></span>`).join('')}</div><button class="${state.themeFamily===id?'primary':'secondary'}" onclick="choosePalette('${id}')">${state.themeFamily===id?'Previewing this theme':'Try this theme'}</button></div>`).join('')}<button class="secondary" onclick="go('home',null,true)">Explore the home screen</button><button class="textbutton" style="width:100%" onclick="go('images')">Try Images to PDF</button><p class="small muted mt">Theme selection here is only for comparison. Launcher A remains selected.</p>`;}
function renderProfile(){head('User profile');$('#main').innerHTML=`<div class="empty" style="padding:20px"><div class="profile-mark" aria-hidden="true">${esc((state.profile.name||'You').slice(0,1).toUpperCase())}</div><h2>Your space</h2><p>A local profile for this device. No sign-in or cloud account is required.</p></div>${field('Display name','profile-name','Your name',esc(state.profile.name))}${field('Device / workspace label','profile-label','Personal toolkit',esc(state.profile.label))}<p class="small muted">Use sample details in this hosted prototype. The native profile will be stored on-device.</p>`;action('Save profile',"saveProfile()");}
function saveProfile(){state.profile={name:$('#profile-name').value.trim().slice(0,60),label:$('#profile-label').value.trim().slice(0,80)};render();toast('Sample local profile saved for this page session.')}
// Reviewer controls are separate from production chrome.
document.querySelector('.reviewbar').innerHTML='<span>Interactive review<br>Sample data only</span><button onclick="go(\'review\')">Screens</button><button onclick="go(\'themes\')">Themes</button>';
applyPalette();render();

$('#dialog').addEventListener('close',clearPasswordInputs);

picker.addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','Home','End'].includes(e.key))return;const choices=[...picker.querySelectorAll('[role=radio]:not(:disabled)')];let i=choices.indexOf(document.activeElement);if(!choices.length)return;e.preventDefault();i=e.key==='Home'?0:e.key==='End'?choices.length-1:(i+(e.key==='ArrowDown'?1:-1)+choices.length)%choices.length;choices[i].focus()});
function openFlowOutput(){const type=flowValidation().type;state.tool=type==='xlsx'?'D04':type==='images'?'D12':type==='pdf-locked'?'D03':'D07';state.protectionSummary=type==='pdf-locked'?'File-open password set':type==='xlsx'?'Password removed':'';state.resultPages=[1,2];go('preview')}
const previousFlowRun=renderWorkflowRun;
renderWorkflowRun=function(){previousFlowRun();action('Preview output','openFlowOutput()')};

logo=function(id,cls=''){return '<img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/67a07e9d-597f-4bbc-8416-567520d5b34b/brand-assets/toolkit-folded-t/launcher-a.svg" class="logoicon '+cls+'" alt="Toolkit Folded T" style="background:none">'};render();

</script>
</div></body></html>
